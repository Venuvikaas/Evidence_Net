name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/evidence_net scripts

      - name: Unit tests
        run: pytest

      - name: Environment check
        run: python scripts/check_env.py

      - name: Smoke pipeline on fixtures
        run: python scripts/smoke.py

      - name: Verify run bundle contents
        run: python scripts/smoke.py --run-id smoke-ci-verify | tail -n 1
