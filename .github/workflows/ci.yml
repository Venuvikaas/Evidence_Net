name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/evidence_net scripts

      - name: Unit tests
        run: pytest

      - name: Handoff verification (four-developer kill switch)
        run: python scripts/verify_handoff.py

      - name: Measurement-consistency smoke (Lane B, synthetic)
        run: python scripts/measure_consistency.py --synthetic --run-id smoke-ci-consistency

      - name: Model-stability smoke (Lane B, synthetic)
        run: python scripts/measure_stability.py --synthetic --run-id smoke-ci-stability

      - name: Familiarity smoke (Lane B, synthetic)
        run: python scripts/measure_familiarity.py --synthetic --run-id smoke-ci-familiarity

      - name: Structural-risk smoke (Lane B, synthetic)
        run: python scripts/measure_structural_risk.py --synthetic --run-id smoke-ci-structural-risk

      - name: Benefit predictor train smoke (Lane A, synthetic)
        run: python scripts/train_benefit.py --synthetic --n-samples 6 --epochs 2 --run-id smoke-ci-benefit-train

      - name: Benefit predictor eval smoke (Lane A, synthetic)
        run: python scripts/measure_benefit.py --synthetic --n-samples 6 --run-id smoke-ci-benefit-eval

      - name: Decision policy smoke (Lane A, synthetic)
        run: python scripts/measure_policy.py --synthetic --n-samples 6 --run-id smoke-ci-policy

      - name: Pipeline benchmark smoke (Lane D, synthetic)
        run: python scripts/benchmark_pipeline.py --synthetic --n-samples 4 --run-id smoke-ci-benchmark

      - name: Phase 18 final-inference smoke (needs local checkpoints; skips if absent)
        run: python scripts/run_final_inference.py --smoke --run-id smoke-ci-final-inference

      - name: Environment check
        run: python scripts/check_env.py

      - name: Smoke pipeline on fixtures
        run: python scripts/smoke.py

      - name: Verify run bundle contents
        run: python scripts/smoke.py --run-id smoke-ci-verify | tail -n 1

      - name: Proposal smoke training (synthetic)
        run: python scripts/train_proposal.py --config configs/model/proposal-smoke.yaml --synthetic --run-id smoke-ci-proposal

      - name: Verify proposal run bundle
        run: |
          python -c "
          import json
          from pathlib import Path

          run_dir = Path('runs/smoke-ci-proposal')
          assert run_dir.is_dir(), f'missing run dir {run_dir}'
          manifest = json.loads((run_dir / 'manifest.json').read_text(encoding='utf-8'))
          metrics = json.loads((run_dir / 'metrics.json').read_text(encoding='utf-8'))
          assert manifest['model']['name'] == 'BoundedDetailProposal', manifest['model']
          assert 'final_train_loss' in metrics, list(metrics)
          assert (run_dir / 'logs' / 'training-history.json').is_file()
          checkpoint_ref = (run_dir / 'checkpoint-or-reference.txt').read_text(encoding='utf-8').strip()
          assert checkpoint_ref and checkpoint_ref != 'no-checkpoint'
          assert Path(checkpoint_ref).is_file(), checkpoint_ref
          print('proposal run bundle verified')
          "
